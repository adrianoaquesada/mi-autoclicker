name: CI

on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Tests, lint y build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Validar la extensión
        run: npm run lint

      - name: Construir el paquete
        run: npm run build

      - name: Guardar el paquete generado
        uses: actions/upload-artifact@v4
        with:
          name: mi-autoclicker-firefox
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
