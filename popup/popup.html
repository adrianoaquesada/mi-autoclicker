<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mi Autoclicker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="cabecera">
      <img src="../icons/icono-48.png" alt="" width="22" height="22" />
      <h1 data-i18n="nombre">Mi Autoclicker</h1>
      <span class="chip" id="chip" data-i18n="estadoInactivo">Inactivo</span>
    </header>

    <section class="sitio">
      <div class="sitio-fila">
        <span class="etiqueta" data-i18n="etiquetaSitio">Sitio actual</span>
        <strong id="host" class="host">—</strong>
      </div>
      <button type="button" id="alternar" class="boton-principal" data-i18n="activarSitio">
        Activar en este sitio
      </button>
      <p class="aviso" id="aviso" hidden></p>
    </section>

    <section class="ajustes">
      <div class="campo">
        <div class="campo-cabecera">
          <label for="cps" data-i18n="etiquetaCps">Clics por segundo</label>
          <output id="cps-valor" for="cps">10</output>
        </div>
        <input type="range" id="cps" min="1" max="100" step="1" value="10" />
      </div>

      <fieldset class="campo">
        <legend data-i18n="etiquetaTipoClic">Tipo de clic</legend>
        <div class="segmentado">
          <label>
            <input type="radio" name="tipo" value="izquierdo" checked />
            <span data-i18n="clicIzquierdo">Izquierdo</span>
          </label>
          <label>
            <input type="radio" name="tipo" value="derecho" />
            <span data-i18n="clicDerecho">Derecho</span>
          </label>
          <label>
            <input type="radio" name="tipo" value="central" />
            <span data-i18n="clicCentral">Central</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="campo">
        <legend data-i18n="etiquetaModo">Modo</legend>
        <div class="segmentado">
          <label>
            <input type="radio" name="modo" value="continuo" checked />
            <span data-i18n="modoContinuo">Continuo</span>
          </label>
          <label>
            <input type="radio" name="modo" value="mantener" />
            <span data-i18n="modoMantener">Mantener tecla</span>
          </label>
        </div>
        <p class="ayuda" id="ayuda-modo" data-i18n="ayudaContinuo">
          Con la tecla pausas o reanudas el autoclicker.
        </p>
      </fieldset>

      <div class="campo">
        <label for="tecla" data-i18n="etiquetaTecla">Tecla rápida</label>
        <div class="tecla-fila">
          <input
            type="text"
            id="tecla"
            readonly
            value="F8"
            data-i18n-placeholder="capturarTecla"
            placeholder="Pulsa una tecla…"
          />
          <button type="button" id="restablecer-tecla" class="boton-secundario" data-i18n="restablecerTecla">
            Restablecer
          </button>
        </div>
      </div>

      <label class="casilla">
        <input type="checkbox" id="indicador" checked />
        <span data-i18n="mostrarIndicador">Mostrar indicador en la página</span>
      </label>
    </section>

    <footer class="pie">
      <span class="contador">
        <span data-i18n="clicsSesion">Clics</span>:
        <b id="contador">0</b>
      </span>
      <button type="button" id="opciones" class="enlace" data-i18n="abrirOpciones">
        Todas las opciones
      </button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
